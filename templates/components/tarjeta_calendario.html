<div class="tarjeta citas-hoy">
    <h2>📅 Citas de Hoy</h2>

    <div class="lista-citas">
        {% for cita in mis_citas_hoy %}
        <div class="cita-card">
            <div class="cita-info">
                <strong>🕒 {{ cita.hora }} {% if cita.hora_fin%}- {{cita.hora_fin}}{% endif %} hs</strong> - 🐾 <strong>{{ cita.paciente }}</strong>
                <p class="cita-motivo">{{ cita.motivo }}</p>
            </div>

            <div class="cita-acciones">
                <button type="button" class="btn-editar" onclick="document.getElementById('modal-editar-{{ cita._id }}').style.display='flex'">
                    ✏️
                </button>

                <form action="{{ url_for('web.eliminar_cita', id=cita._id) }}" method="POST" onsubmit="return confirm('¿Seguro que quieres cancelar esta cita?');" style="margin:0;">
                    <button type="submit" class="btn-eliminar">🗑️</button>
                </form>
            </div>
        </div>

        <!-- Modal de Edición -->
        <div id="modal-editar-{{ cita._id }}" class="modal-overlay">
            <div class="modal-contenido">
                <h3>✏️ Editar Cita</h3>
                <form action="{{ url_for('web.editar_cita', id=cita._id) }}" method="POST">
                    <div class="campo-form">
                        <label>Fecha:</label>
                        <input type="date" name="fecha" value="{{ cita.fecha or fecha_hoy }}" required>
                    </div>
                    <div class="campo-form">
                        <label>Hora de inicio:</label>
                        <input type="time" name="hora" value="{{ cita.hora }}" required>
                    </div>
                    <div class="campo-form">
                        <label>Duración:</label>
                        <select name="duracion" required>
                            <option value="15" {% if cita.duracion_minutos == 15 %}selected{% endif %}>15 minutos</option>
                            <option value="30" {% if cita.duracion_minutos == 30 or not cita.duracion_minutos %}selected{% endif %}>30 minutos</option>
                            <option value="45" {% if cita.duracion_minutos == 45 %}selected{% endif %}>45 minutos</option>
                            <option value="60" {% if cita.duracion_minutos == 60 %}selected{% endif %}>60 minutos (1 hora)</option>
                            <option value="90" {% if cita.duracion_minutos == 90 %}selected{% endif %}>90 minutos</option>
                        </select>
                    </div>
                    <div class="campo-form">
                        <label>Paciente:</label>
                        <input type="text" name="paciente" value="{{ cita.paciente }}" required>
                    </div>
                    <div class="campo-form">
                        <label>Motivo de consulta:</label>
                        <textarea name="motivo" rows="3" required>{{ cita.motivo }}</textarea>
                    </div>
                    <div class="modal-acciones">
                        <button type="button" class="btn-cancelar" onclick="document.getElementById('modal-editar-{{ cita._id }}').style.display='none'">Cancelar</button>
                        <button type="submit" class="btn-guardar">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
        {% else %}
        <p class="citas-vacias">No hay citas agendadas para el día de hoy.</p>
        {% endfor %}
    </div>
</div>
